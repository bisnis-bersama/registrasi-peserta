<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registrasi Peserta</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="nav"><div class="logo">REGISTRASI PESERTA</div><a href="index.html">← Beranda</a></div></header>
<div class="container"><div class="card"><h1>Registrasi Peserta Umum</h1><p class="muted">Kode unik dibuat otomatis.</p><div class="grid">
<div><label>Kode Unik</label><input id="kode" readonly></div><div><label>Nama Lengkap *</label><input id="nama" required></div>
<div><label>Nama Toko/Konter *</label><input id="toko" required></div><div><label>No. WhatsApp *</label><input id="waPeserta" required></div>
<div><label>Alamat *</label><input id="alamat" required></div><div><label>Email *</label><input id="email" type="email"></div>
<div><label>Ukuran Kaos *</label><select id="ukuran"><option>S</option><option>M</option><option>L</option><option>XL</option><option>XXL</option><option>XXXL</option></select></div>
<div><label>Bukti Transfer *</label><input id="bukti" type="file" accept="image/*,.pdf"></div>
</div><div class="actions"><button class="red" onclick="daftar()">KIRIM REGISTRASI</button></div><p id="msg"></p></div></div><script src="app.js"></script></body></html>
