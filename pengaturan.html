<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pengaturan Acara - DPD TESPOIN Majalengka</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f3f3;color:#222;font-family:Arial,sans-serif}
.wrap{max-width:800px;margin:auto;padding:18px}
.header{background:#111;color:#fff;border-radius:18px;padding:20px;text-align:center}
.header h1{margin:0;color:#f5c400;font-size:22px}
.header p{margin:7px 0 0;color:#ddd;font-size:13px}
.card{background:#fff;margin-top:16px;padding:18px;border-radius:16px;box-shadow:0 3px 15px rgba(0,0,0,.07)}
label{display:block;font-weight:800;font-size:13px;margin:13px 0 6px}
input,textarea,select{width:100%;padding:12px;border:1px solid #d8d8d8;border-radius:9px;font-size:14px;background:#fff}
textarea{min-height:100px;resize:vertical}
button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:10px;background:#f5c400;color:#111;font-size:15px;font-weight:900;cursor:pointer}
.msg{display:none;margin-top:14px;padding:12px;border-radius:10px;font-weight:700;font-size:13px}
.ok{display:block;background:#dff5e4;color:#087b25}
.err{display:block;background:#ffe1e1;color:#a00000}
.back{display:block;text-align:center;margin-top:15px;color:#666;text-decoration:none;font-size:13px}
.note{font-size:12px;color:#777;line-height:1.5;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>PENGATURAN ACARA</h1>
    <p>DPD TESPOIN MAJALENGKA</p>
  </div>

  <div class="card">
    <form id="form">
      <label>Judul Acara</label>
      <input id="judul" required>

      <label>Deskripsi</label>
      <textarea id="deskripsi"></textarea>

      <label>Tanggal</label>
      <input id="tanggal" type="date">

      <label>Waktu</label>
      <input id="waktu" placeholder="10.00 WIB - selesai">

      <label>Lokasi</label>
      <input id="lokasi">

      <label>Harga Tiket</label>
      <input id="harga" type="number" min="0" placeholder="150000">

      <label>Kuota</label>
      <input id="kuota" type="number" min="0" placeholder="300">

      <label>Nomor WhatsApp Panitia</label>
      <input id="wa" type="tel" placeholder="08xxxxxxxxxx">

      <label>Benefit Peserta</label>
      <textarea id="benefit" placeholder="Kaos, makan, coffee break, sertifikat, doorprize, dll."></textarea>

      <label>Link Pamflet</label>
      <input id="pamflet" type="url" placeholder="https://...">

      <label>Status Pendaftaran</label>
      <select id="status">
        <option value="DIBUKA">DIBUKA</option>
        <option value="DITUTUP">DITUTUP</option>
      </select>

      <button type="submit">SIMPAN PENGATURAN</button>
      <div id="msg" class="msg"></div>
      <div class="note">Pengaturan ini disimpan ke sheet PENGATURAN dan dapat dipakai oleh halaman depan/registrasi.</div>
    </form>
  </div>

  <a href="index-admin.html" class="back">← Kembali ke Dashboard Admin</a>
</div>

<script>
const API_URL='https://script.google.com/macros/s/AKfycbxPM09axMCDYVMpMjGya5aoCDIhcs5MrcdeP0AlGB2BSzH8a2NigppNmAjV3lSH0-XH/exec';

function setVal(id,v){document.getElementById(id).value=v??''}

async function parseResponse(r){
  const raw=await r.text();
  try{return JSON.parse(raw.trim())}
  catch(e){throw new Error('Respons API tidak dapat dibaca. Pastikan Web App Apps Script sudah di-deploy versi terbaru.')}
}

async function load(){
  try{
    const r=await fetch(API_URL+'?action=pengaturan&_='+Date.now());
    const d=await parseResponse(r);
    if(!d.ok)throw new Error(d.message||'Gagal mengambil pengaturan.');
    const p=d.pengaturan||d.data||d;
    setVal('judul',p.judulAcara||p.judul||'');
    setVal('deskripsi',p.deskripsi||'');
    setVal('tanggal',p.tanggal||'');
    setVal('waktu',p.waktu||'');
    setVal('lokasi',p.lokasi||'');
    setVal('harga',p.hargaTiket??p.harga??'');
    setVal('kuota',p.kuota??'');
    setVal('wa',p.nomorWa??p.wa??'');
    setVal('benefit',p.benefit||'');
    setVal('pamflet',p.pamflet||'');
    setVal('status',p.statusPendaftaran||p.status||'DIBUKA');
  }catch(e){
    show(e.message,false);
  }
}

document.getElementById('form').addEventListener('submit',async e=>{
  e.preventDefault();
  const btn=e.target.querySelector('button');
  btn.disabled=true;btn.textContent='MENYIMPAN...';
  try{
    const body={
      action:'simpanPengaturan',
      judulAcara:document.getElementById('judul').value.trim(),
      deskripsi:document.getElementById('deskripsi').value.trim(),
      tanggal:document.getElementById('tanggal').value,
      waktu:document.getElementById('waktu').value.trim(),
      lokasi:document.getElementById('lokasi').value.trim(),
      hargaTiket:document.getElementById('harga').value,
      kuota:document.getElementById('kuota').value,
      nomorWa:document.getElementById('wa').value.trim(),
      benefit:document.getElementById('benefit').value.trim(),
      pamflet:document.getElementById('pamflet').value.trim(),
      statusPendaftaran:document.getElementById('status').value
    };
    const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
    const d=await parseResponse(r);
    if(!d.ok)throw new Error(d.message||'Gagal menyimpan.');
    show('Pengaturan berhasil disimpan.',true);
  }catch(e){
    show(e.message,false);
  }finally{
    btn.disabled=false;btn.textContent='SIMPAN PENGATURAN';
  }
});

function show(t,ok){
  const e=document.getElementById('msg');
  e.textContent=t;e.className='msg '+(ok?'ok':'err');e.style.display='block';
}

load();
</script>
</body>
</html>
