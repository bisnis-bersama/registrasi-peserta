<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pengaturan</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="nav"><div class="logo">PENGATURAN ACARA</div><nav><a href="index.html">Index</a><a href="peserta.html">Peserta</a><a href="lunas.html">Lunas</a></nav></div></header>
<div class="container"><div class="card"><h1>Pengaturan Acara</h1><p class="muted">Semua informasi yang disimpan di sini nantinya menjadi sumber tampilan index.</p>
<div class="grid">
<div><label>Judul Acara</label><input id="judul"></div><div><label>Subjudul/Deskripsi</label><input id="deskripsi"></div>
<div><label>Tanggal</label><input id="tanggal" placeholder="Contoh: Minggu, 23 November 2026"></div><div><label>Waktu</label><input id="waktu" placeholder="10.00 WIB - selesai"></div>
<div><label>Lokasi</label><input id="lokasi"></div><div><label>Tiket</label><input id="tiket" placeholder="Rp150.000"></div>
<div><label>Kuota</label><input id="kuota"></div><div><label>Nomor WA Panitia</label><input id="wa"></div>
</div><label>Benefit</label><textarea id="benefit" placeholder="Kaos, makan, sertifikat, doorprize, dll."></textarea>
<label>Gambar Pamflet</label><input id="pamflet" type="file" accept="image/*"><div class="actions"><button class="red" onclick="simpanPengaturan()">SIMPAN PENGATURAN</button></div>
<p id="msg"></p></div></div><script src="app.js"></script></body></html>
