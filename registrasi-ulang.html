<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Registrasi Ulang - DPD TESPOIN Majalengka</title>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f3f3;font-family:Arial,sans-serif;color:#222}
.wrap{max-width:720px;margin:auto;padding:16px}
.header{background:#111;color:#fff;border-radius:18px;padding:20px;text-align:center}
.header h1{margin:0;color:#f5c400;font-size:22px}
.header p{margin:6px 0 0;color:#ddd;font-size:13px}
.card{background:#fff;border-radius:16px;padding:18px;margin-top:15px;box-shadow:0 3px 15px rgba(0,0,0,.07)}
#reader{width:100%;max-width:520px;margin:auto}
.scan-note{text-align:center;color:#777;font-size:12px;margin-top:10px}
.manual{display:flex;gap:8px;margin-top:15px}
.manual input{flex:1;padding:12px;border:1px solid #ddd;border-radius:10px}
button{border:0;border-radius:10px;padding:12px 15px;font-weight:800;cursor:pointer}
.btn{background:#f5c400;color:#111}
.result{display:none;margin-top:16px}
.ok{background:#e9f8ed;border:1px solid #b9e5c3}
.warn{background:#fff3cd;border:1px solid #f0d98a}
.err{background:#ffe6e6;color:#9b0000}
.result{padding:15px;border-radius:12px}
.title{font-size:18px;font-weight:900;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:15px;padding:9px 0;border-bottom:1px solid rgba(0,0,0,.08);font-size:13px}
.row:last-child{border-bottom:0}
.row span{color:#666}
.row b{text-align:right;word-break:break-word}
.status{display:inline-block;padding:5px 9px;border-radius:15px;font-size:11px;font-weight:900}
.lunas{background:#dff5e4;color:#087b25}
.belum{background:#fff3cd;color:#856404}
.hadir{background:#dff5e4;color:#087b25}
.belumhadir{background:#eee;color:#555}
.back{display:block;text-align:center;margin-top:14px;color:#666;text-decoration:none;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>REGISTRASI ULANG</h1>
    <p>DPD TESPOIN MAJALENGKA</p>
  </div>

  <div class="card">
    <div id="reader"></div>
    <div class="scan-note">Arahkan kamera ke QR peserta.</div>

    <div class="manual">
      <input id="kodeManual" placeholder="Atau masukkan REG-0001">
      <button class="btn" onclick="prosesKode(document.getElementById('kodeManual').value)">CEK</button>
    </div>

    <div id="result" class="result"></div>
  </div>

  <a class="back" href="index-admin.html">← Kembali ke Dashboard Admin</a>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxPM09axMCDYVMpMjGya5aoCDIhcs5MrcdeP0AlGB2BSzH8a2NigppNmAjV3lSH0-XH/exec';
let sedangProses = false;

async function apiGet(url){
  const r = await fetch(url);
  const raw = await r.text();
  try{return JSON.parse(raw.trim())}
  catch(e){throw new Error('Respons API tidak dapat dibaca.')}
}

async function apiPost(data){
  const r = await fetch(API_URL,{
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(data)
  });
  const raw=await r.text();
  try{return JSON.parse(raw.trim())}
  catch(e){throw new Error('Respons API tidak dapat dibaca.')}
}

async function prosesKode(kode){
  if(sedangProses)return;
  kode=String(kode||'').trim().toUpperCase();
  if(!kode){tampil('Masukkan atau scan kode registrasi.', 'warn');return}

  sedangProses=true;
  try{
    // Cek dulu data dan status saat ini.
    const cari=await apiGet(API_URL+'?action=cari&kode='+encodeURIComponent(kode)+'&_='+Date.now());
    if(!cari.ok)throw new Error(cari.message||'Peserta tidak ditemukan.');

    const p=cari.peserta;

    // Jika sudah hadir, jangan kirim check-in kedua kali.
    if(String(p.statusKehadiran||'').toUpperCase()==='HADIR'){
      tampilData(p,'sudah');
      return;
    }

    // Check-in hanya mengubah kehadiran, bukan pembayaran.
    const check=await apiPost({action:'checkin',kode:kode});

    if(!check.ok){
      if(check.alreadyCheckin && check.peserta){
        tampilData(check.peserta,'sudah');
        return;
      }
      throw new Error(check.message||'Registrasi ulang gagal.');
    }

    tampilData(check.peserta,'berhasil');

  }catch(e){
    tampil('<div class="title">GAGAL</div><div>'+esc(e.message)+'</div>','err');
  }finally{
    sedangProses=false;
  }
}

function tampilData(p,mode){
  const bayar=String(p.statusPembayaran||'BELUM LUNAS').toUpperCase();
  const hadir=String(p.statusKehadiran||'BELUM HADIR').toUpperCase();

  let cls='ok', title='✓ REGISTRASI ULANG BERHASIL';
  if(mode==='sudah'){
    cls='warn';
    title='⚠ SUDAH REGISTRASI ULANG';
  }

  tampil(`
    <div class="title">${title}</div>
    <div class="row"><span>Kode Registrasi</span><b>${esc(p.kode)}</b></div>
    <div class="row"><span>Nama Peserta</span><b>${esc(p.nama)}</b></div>
    <div class="row"><span>Nama Toko</span><b>${esc(p.toko)}</b></div>
    <div class="row"><span>Alamat</span><b>${esc(p.alamat)}</b></div>
    <div class="row"><span>No. WhatsApp</span><b>${esc(p.wa)}</b></div>
    <div class="row"><span>Email</span><b>${esc(p.email)}</b></div>
    <div class="row"><span>Ukuran Kaos</span><b>${esc(p.ukuran)}</b></div>
    <div class="row"><span>Status Pembayaran</span><b><span class="status ${bayar==='LUNAS'?'lunas':'belum'}">${esc(bayar)}</span></b></div>
    <div class="row"><span>Nominal Pembayaran</span><b>${p.nominalPembayaran?rupiah(p.nominalPembayaran):'-'}</b></div>
    <div class="row"><span>Status Kehadiran</span><b><span class="status ${hadir==='HADIR'?'hadir':'belumhadir'}">${esc(hadir)}</span></b></div>
    <div class="row"><span>Jam Check-in</span><b>${esc(p.jamCheckin||'-')}</b></div>
  `,cls);
}

function tampil(html,cls){
  const el=document.getElementById('result');
  el.className='result '+cls;
  el.innerHTML=html;
  el.style.display='block';
}

function rupiah(v){
  const n=Number(String(v).replace(/[^0-9.-]/g,''));
  return isNaN(n)?esc(v):'Rp '+n.toLocaleString('id-ID');
}
function esc(v){
  return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function onScanSuccess(decodedText){
  if(sedangProses)return;
  prosesKode(decodedText);
}

function onScanFailure(){}

const scanner=new Html5QrcodeScanner(
  "reader",
  {
    fps:10,
    qrbox:{width:250,height:250},
    rememberLastUsedCamera:true
  },
  false
);
scanner.render(onScanSuccess,onScanFailure);
</script>
</body>
</html>
