<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Registrasi Ulang - DPD TESPOIN Majalengka</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
*{
  box-sizing:border-box
}

body{
  margin:0;
  background:#f3f3f3;
  font-family:Arial,sans-serif;
  color:#222
}

.wrap{
  max-width:720px;
  margin:auto;
  padding:16px
}

.header{
  background:#111;
  color:#fff;
  border-radius:18px;
  padding:20px;
  text-align:center
}

.header h1{
  margin:0;
  color:#f5c400;
  font-size:22px
}

.header p{
  margin:6px 0 0;
  color:#ddd;
  font-size:13px
}

.card{
  background:#fff;
  border-radius:16px;
  padding:18px;
  margin-top:15px;
  box-shadow:0 3px 15px rgba(0,0,0,.07)
}

#reader{
  width:100%;
  max-width:520px;
  margin:auto;
  overflow:hidden;
  border-radius:12px
}

.camera-status{
  text-align:center;
  padding:10px;
  font-size:13px;
  color:#666
}

.camera-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px
}

button{
  border:0;
  border-radius:10px;
  padding:13px 15px;
  font-weight:800;
  cursor:pointer
}

.btn{
  background:#f5c400;
  color:#111
}

.btn-dark{
  background:#111;
  color:#fff
}

.btn-red{
  background:#d90000;
  color:#fff
}

.scan-note{
  text-align:center;
  color:#777;
  font-size:12px;
  margin-top:10px
}

.manual{
  display:flex;
  gap:8px;
  margin-top:15px
}

.manual input{
  flex:1;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:15px
}

.result{
  display:none;
  margin-top:16px;
  padding:15px;
  border-radius:14px
}


/* =========================
   HASIL BERHASIL
========================= */

.result.success{
  background:#e9f8ed;
  border:1px solid #b9e5c3;
  color:#222
}


/* =========================
   SUDAH REGISTRASI ULANG
========================= */

.result.already{
  background:#fff3cd;
  border:1px solid #efd98b;
  color:#222
}


/* =========================
   BELUM LUNAS / GAGAL
========================= */

.result.failed{
  background:#ffe6e6;
  border:1px solid #f0bcbc;
  color:#9b0000
}


/* =========================
   JUDUL HASIL
========================= */

.result-title{
  font-size:20px;
  font-weight:900;
  margin-bottom:8px
}

.result-subtitle{
  font-size:15px;
  font-weight:700;
  line-height:1.45;
  margin-bottom:15px
}


/* =========================
   DATA PESERTA
========================= */

.row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:9px 0;
  border-bottom:1px solid rgba(0,0,0,.08);
  font-size:13px
}

.row:last-child{
  border-bottom:0
}

.row span{
  color:#666
}

.row b{
  text-align:right;
  word-break:break-word
}


/* =========================
   STATUS
========================= */

.status{
  display:inline-block;
  padding:5px 9px;
  border-radius:15px;
  font-size:11px;
  font-weight:900
}

.lunas{
  background:#dff5e4;
  color:#087b25
}

.belum{
  background:#fff3cd;
  color:#856404
}

.hadir{
  background:#dff5e4;
  color:#087b25
}

.belumhadir{
  background:#eee;
  color:#555
}


/* =========================
   PERINGATAN BENEFIT
========================= */

.benefit-warning{
  margin-top:15px;
  padding:13px;
  border-radius:10px;
  background:#fff;
  border:1px solid #e0c86b;
  font-size:13px;
  line-height:1.5
}

.benefit-warning b{
  display:block;
  margin-bottom:4px
}


/* =========================
   GAGAL
========================= */

.failed-title{
  font-size:20px;
  font-weight:900;
  margin-bottom:8px
}

.failed-message{
  font-size:16px;
  font-weight:800;
  line-height:1.45;
  margin-bottom:14px
}


/* =========================
   BACK
========================= */

.back{
  display:block;
  text-align:center;
  margin-top:14px;
  color:#666;
  text-decoration:none;
  font-size:13px
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:520px){

  .manual{
    display:block
  }

  .manual button{
    width:100%;
    margin-top:8px
  }

  .camera-actions{
    grid-template-columns:1fr
  }

  .row{
    align-items:flex-start
  }

  .row b{
    max-width:58%
  }

}
</style>
</head>


<body>

<div class="wrap">


  <!-- =========================
       HEADER
  ========================== -->

  <div class="header">

    <h1>
      REGISTRASI ULANG
    </h1>

    <p>
      DPD TESPOIN MAJALENGKA
    </p>

  </div>



  <!-- =========================
       CARD UTAMA
  ========================== -->

  <div class="card">


    <!-- CAMERA -->

    <div id="reader"></div>


    <div
      id="cameraStatus"
      class="camera-status">

      Kamera belum aktif.
      Tekan <b>BUKA KAMERA</b>.

    </div>


    <div class="camera-actions">

      <button
        class="btn"
        id="btnCamera"
        onclick="bukaKamera()">

        📷 BUKA KAMERA

      </button>


      <button
        class="btn-dark"
        id="btnStop"
        onclick="tutupKamera()"
        disabled>

        ■ TUTUP KAMERA

      </button>

    </div>


    <div class="scan-note">

      Setelah kamera terbuka,
      arahkan kamera belakang ke QR peserta.

    </div>


    <!-- MANUAL -->

    <div class="manual">

      <input
        id="kodeManual"
        placeholder="Atau masukkan REG-0001">


      <button
        class="btn"
        onclick="prosesKode(document.getElementById('kodeManual').value)">

        CEK

      </button>

    </div>



    <!-- ==================================================
         HASIL SCAN
    ================================================== -->

    <div
      id="result"
      class="result">


      <!--
        JS NANTI AKAN MENGISI
        HASIL DI SINI.

        KONDISI:

        1. SUCCESS
        2. ALREADY
        3. FAILED

      -->

    </div>


  </div>



  <a
    class="back"
    href="index-admin.html">

    ← Kembali ke Dashboard Admin

  </a>


</div>



<script>

/*
====================================================
JAVASCRIPT LAMA TETAP DULU
====================================================

A Yudi minta halaman dulu.

Jadi bagian validasi server / Code.gs
BELUM DIUBAH.

JavaScript yang sekarang tetap bisa
digunakan sementara.

Nanti setelah tampilan ini cocok,
baru kita perbaiki JS + Code.gs
untuk mengunci:

1. BELUM LUNAS → DITOLAK
2. LUNAS → BOLEH CHECK-IN
3. SUDAH HADIR → DITOLAK
4. SCAN ULANG → TIDAK MENDAPAT BENEFIT LAGI

====================================================
*/

</script>

</body>
</html>
