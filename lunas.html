<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Peserta Lunas - DPD TESPOIN Majalengka</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f3f3;color:#222;font-family:Arial,sans-serif}
.wrap{max-width:1050px;margin:auto;padding:18px}
.header{background:#111;color:#fff;border-radius:18px;padding:20px;text-align:center}
.header h1{margin:0;color:#f5c400;font-size:23px}
.header p{margin:6px 0 0;color:#ddd;font-size:13px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:15px 0}
.box{background:#fff;border-radius:14px;padding:15px;text-align:center;box-shadow:0 3px 12px rgba(0,0,0,.06)}
.box strong{display:block;font-size:25px}
.box span{font-size:12px;color:#777}
.search{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;margin-bottom:14px;font-size:15px}
.card{background:#fff;border-radius:16px;padding:15px;box-shadow:0 3px 15px rgba(0,0,0,.06);overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:850px}
th,td{padding:11px 8px;border-bottom:1px solid #eee;text-align:left;font-size:13px}
th{background:#111;color:#f5c400}
.badge{display:inline-block;background:#dff5e4;color:#087b25;border-radius:20px;padding:5px 9px;font-size:11px;font-weight:900}
.empty{text-align:center;color:#888;padding:30px}
.msg{display:none;padding:11px;border-radius:10px;margin-bottom:12px;font-size:13px;font-weight:700}
.error{background:#ffe1e1;color:#a00000}
.back{display:block;text-align:center;margin-top:15px;color:#666;text-decoration:none;font-size:13px}
.btn{border:0;border-radius:9px;padding:8px 10px;font-weight:800;background:#f5c400;cursor:pointer}
@media(max-width:650px){.summary{grid-template-columns:1fr 1fr}.summary .box:last-child{grid-column:1/-1}}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>PESERTA LUNAS</h1>
    <p>DPD TESPOIN MAJALENGKA</p>
  </div>

  <div class="summary">
    <div class="box"><strong id="total">0</strong><span>TOTAL PESERTA LUNAS</span></div>
    <div class="box"><strong id="hadir">0</strong><span>SUDAH HADIR</span></div>
    <div class="box"><strong id="belumHadir">0</strong><span>BELUM HADIR</span></div>
  </div>

  <div id="msg" class="msg"></div>

  <input id="cari" class="search" placeholder="Cari REG, nama, toko, atau WhatsApp..." oninput="render()">

  <div class="card">
    <div id="loading" class="empty">Memuat data...</div>
    <div id="tableWrap"></div>
  </div>

  <a href="index-admin.html" class="back">← Kembali ke Dashboard Admin</a>
</div>

<script>
const API_URL='https://script.google.com/macros/s/AKfycbxPM09axMCDYVMpMjGya5aoCDIhcs5MrcdeP0AlGB2BSzH8a2NigppNmAjV3lSH0-XH/exec';
let dataLunas=[];

async function load(){
  try{
    const r=await fetch(API_URL+'?action=lunas&_='+Date.now());
    const raw=await r.text();
    let data;
    try{data=JSON.parse(raw.trim())}catch(e){throw new Error('Respons API tidak dapat dibaca.')}
    if(!data.ok)throw new Error(data.message||'Gagal mengambil data.');
    dataLunas=data.peserta||[];
    updateSummary();
    render();
  }catch(e){
    showMsg(e.message);
    document.getElementById('loading').textContent='Gagal memuat data.';
  }
}

function updateSummary(){
  const hadir=dataLunas.filter(p=>String(p.statusKehadiran||'').toUpperCase()==='HADIR').length;
  document.getElementById('total').textContent=dataLunas.length;
  document.getElementById('hadir').textContent=hadir;
  document.getElementById('belumHadir').textContent=dataLunas.length-hadir;
}

function render(){
  const q=document.getElementById('cari').value.toLowerCase().trim();
  const rows=dataLunas.filter(p=>{
    if(!q)return true;
    return [p.kode,p.nama,p.toko,p.wa,p.alamat].some(v=>String(v||'').toLowerCase().includes(q));
  });

  document.getElementById('loading').style.display='none';

  if(!rows.length){
    document.getElementById('tableWrap').innerHTML='<div class="empty">Belum ada peserta LUNAS.</div>';
    return;
  }

  let out='<table><thead><tr><th>REG</th><th>Nama Peserta</th><th>Toko</th><th>WhatsApp</th><th>Kaos</th><th>Pembayaran</th><th>Kehadiran</th><th>Jam Check-in</th></tr></thead><tbody>';

  rows.forEach(p=>{
    const hadir=String(p.statusKehadiran||'').toUpperCase()==='HADIR';
    out+='<tr>';
    out+='<td><b>'+esc(p.kode)+'</b></td>';
    out+='<td>'+esc(p.nama)+'</td>';
    out+='<td>'+esc(p.toko)+'</td>';
    out+='<td>'+esc(p.wa)+'</td>';
    out+='<td>'+esc(p.ukuran)+'</td>';
    out+='<td><span class="badge">LUNAS</span></td>';
    out+='<td>'+(hadir?'<span class="badge">HADIR</span>':'BELUM HADIR')+'</td>';
    out+='<td>'+esc(p.jamCheckin||'-')+'</td>';
    out+='</tr>';
  });

  out+='</tbody></table>';
  document.getElementById('tableWrap').innerHTML=out;
}

function showMsg(t){
  const e=document.getElementById('msg');
  e.textContent=t;e.className='msg error';e.style.display='block';
}
function esc(v){
  return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

load();
</script>
</body>
</html>
