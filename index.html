<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>DPD TESPOIN MAJALENGKA</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f5f7;
    color:#151515;
}

/* =========================
   HEADER
========================= */

.hero{
    background:#111;
    color:white;
    text-align:center;
    padding:35px 20px 32px;
    position:relative;
    overflow:hidden;
}

.hero:before,
.hero:after{
    content:"";
    position:absolute;
    width:140px;
    height:140px;
    background:#ffc107;
    transform:rotate(45deg);
    opacity:.95;
}

.hero:before{
    left:-95px;
    top:-80px;
}

.hero:after{
    right:-95px;
    top:-80px;
}

.hero-content{
    position:relative;
    z-index:2;
}

.logo{
    width:125px;
    height:125px;
    object-fit:contain;
    margin:auto;
    display:block;
}

.nama-organisasi{
    margin-top:10px;
    font-size:42px;
    font-weight:900;
    line-height:1;
    letter-spacing:1px;
}

.nama-organisasi span{
    color:#ffc107;
}

.subjudul{
    margin-top:14px;
    font-size:17px;
    letter-spacing:2px;
}

.info-title{
    margin-top:32px;
    font-size:28px;
    font-weight:700;
}

/* =========================
   CONTAINER
========================= */

.container{
    max-width:900px;
    margin:auto;
    padding:25px 16px 50px;
}

/* =========================
   CARD INFORMASI
========================= */

.card{
    background:white;
    border-radius:22px;
    padding:28px 22px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.card-title{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:25px;
}

.card-title-icon{
    width:55px;
    height:55px;
    border-radius:50%;
    background:#ffc107;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:27px;
}

.card-title h2{
    font-size:28px;
}

/* =========================
   ITEM INFO
========================= */

.info-item{
    display:flex;
    align-items:flex-start;
    gap:18px;
    margin:25px 0;
}

.info-icon{
    flex:0 0 55px;
    width:55px;
    height:55px;
    border-radius:50%;
    background:#fff2c9;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:26px;
}

.info-text{
    padding-top:3px;
}

.info-label{
    font-size:20px;
    font-weight:700;
    margin-bottom:8px;
}

.info-value{
    font-size:17px;
    color:#555;
}

/* =========================
   BUTTON
========================= */

.tombol{
    display:block;
    width:100%;
    margin-top:25px;
    padding:15px;
    border:0;
    border-radius:12px;
    background:#ffc107;
    color:#111;
    font-size:17px;
    font-weight:800;
    text-align:center;
    text-decoration:none;
}

/* =========================
   RESPONSIVE HP
========================= */

@media(max-width:600px){

    .hero{
        padding:30px 15px 28px;
    }

    .logo{
        width:105px;
        height:105px;
    }

    .nama-organisasi{
        font-size:31px;
    }

    .subjudul{
        font-size:13px;
        letter-spacing:1.5px;
    }

    .info-title{
        font-size:24px;
        margin-top:25px;
    }

    .container{
        padding:18px 14px 40px;
    }

    .card{
        padding:23px 18px;
        border-radius:20px;
    }

    .card-title h2{
        font-size:23px;
    }

    .info-label{
        font-size:19px;
    }

    .info-value{
        font-size:16px;
    }
}
</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header class="hero">

    <div class="hero-content">

        <!-- LOGO -->
        <img
            src="logo.png"
            class="logo"
            alt="Logo TESPOIN">

        <!-- NAMA ORGANISASI -->
        <div class="nama-organisasi">
            DPD TESPOIN
            <br>
            <span>MAJALENGKA</span>
        </div>

        <div class="subjudul">
            TEKNISI PONSEL MAJALENGKA
        </div>

        <div class="info-title">
            Informasi acara
        </div>

    </div>

</header>


<!-- =========================
     CONTENT
========================= -->

<main class="container">

    <section class="card">

        <div class="card-title">

            <div class="card-title-icon">
                📅
            </div>

            <h2>
                Informasi Acara
            </h2>

        </div>


        <!-- TANGGAL -->

        <div class="info-item">

            <div class="info-icon">
                📅
            </div>

            <div class="info-text">

                <div class="info-label">
                    Tanggal
                </div>

                <div
                    class="info-value"
                    id="tanggal">
                    -
                </div>

            </div>

        </div>


        <!-- WAKTU -->

        <div class="info-item">

            <div class="info-icon">
                🕐
            </div>

            <div class="info-text">

                <div class="info-label">
                    Waktu
                </div>

                <div
                    class="info-value"
                    id="waktu">
                    -
                </div>

            </div>

        </div>


        <!-- LOKASI -->

        <div class="info-item">

            <div class="info-icon">
                📍
            </div>

            <div class="info-text">

                <div class="info-label">
                    Lokasi
                </div>

                <div
                    class="info-value"
                    id="lokasi">
                    -
                </div>

            </div>

        </div>


        <!-- TIKET -->

        <div class="info-item">

            <div class="info-icon">
                🎟️
            </div>

            <div class="info-text">

                <div class="info-label">
                    Tiket
                </div>

                <div
                    class="info-value"
                    id="harga">
                    -
                </div>

            </div>

        </div>


        <!-- KUOTA -->

        <div class="info-item">

            <div class="info-icon">
                👥
            </div>

            <div class="info-text">

                <div class="info-label">
                    Kuota
                </div>

                <div
                    class="info-value"
                    id="kuota">
                    -
                </div>

            </div>

        </div>


        <!-- TOMBOL -->

        <a
            href="registrasi.html"
            class="tombol">

            DAFTAR SEKARANG

        </a>

    </section>


    <!-- BENEFIT -->

    <section
        class="card"
        style="margin-top:18px;">

        <div class="card-title">

            <div class="card-title-icon">
                🎁
            </div>

            <h2>
                Benefit Peserta
            </h2>

        </div>

        <div
            id="benefit"
            class="info-value">

            -

        </div>

    </section>

</main>


<script>

/*
=================================================
NANTI DATA DIAMBIL DARI GOOGLE APPS SCRIPT
=================================================
*/

const API_URL = "";


/*
-----------------------------------------------
TAMPILKAN DATA PENGATURAN
-----------------------------------------------
*/

function tampilkanPengaturan(data){

    if(!data){
        return;
    }

    document.getElementById("tanggal")
        .textContent =
        data.tanggal || "-";

    document.getElementById("waktu")
        .textContent =
        data.waktu || "-";

    document.getElementById("lokasi")
        .textContent =
        data.lokasi || "-";

    document.getElementById("harga")
        .textContent =
        data.harga || "-";

    document.getElementById("kuota")
        .textContent =
        data.kuota || "-";

    document.getElementById("benefit")
        .textContent =
        data.benefit || "-";
}

</script>

</body>
</html>
